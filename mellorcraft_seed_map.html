<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MellorCraft v1.8.3 Seed Map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15171b;color:#eee;font-family:Arial,sans-serif}
#toolbar{position:fixed;z-index:5;top:0;left:0;right:0;min-height:58px;background:rgba(20,22,27,.96);display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 12px #0008;flex-wrap:wrap}
input,select,button{background:#262a32;color:#eee;border:1px solid #555;border-radius:5px;padding:8px 10px}
button{cursor:pointer;background:#285b38}
button:hover{filter:brightness(1.15)}
label{font-size:13px;color:#ccc}
#map{position:absolute;top:58px;left:0;width:100%;height:calc(100% - 58px);cursor:grab;image-rendering:pixelated}
#weatherPlay.active{background:#8a5b22}
.weather-readout{font-size:11px;color:#bcd7f4;white-space:nowrap}
#map.dragging{cursor:grabbing}
#tooltip{position:fixed;z-index:8;display:none;pointer-events:none;background:#111e;border:1px solid #aaa;padding:8px 10px;border-radius:5px;font-size:12px;line-height:1.45;max-width:270px}
#legend{position:fixed;z-index:6;right:10px;bottom:10px;background:#111d;border:1px solid #777;border-radius:7px;padding:9px;font-size:11px;max-height:45vh;overflow:auto}
.legend-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.swatch{width:13px;height:13px;border:1px solid #aaa;display:inline-block}
#status{font-size:12px;color:#bbb;min-width:230px}
#mapFilters{position:fixed;z-index:10;right:12px;top:62px;background:#171b22;border:1px solid #66717f;border-radius:7px;width:min(330px,90vw);box-shadow:0 5px 20px #0008;font-size:13px}
#mapFilters>summary{padding:10px 13px;cursor:pointer;font-weight:700}
#mapFilters .filter-content{padding:0 12px 12px;max-height:55vh;overflow:auto}
#mapFilters .filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;margin:7px 0}
#mapFilters label{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
#mapFilters input{accent-color:#77bc8b}
#mapFilters .filter-actions{display:flex;gap:7px;margin:6px 0 10px}
#mapFilters .filter-actions button{padding:5px 9px;font-size:11px}
#mapFilters h4{margin:8px 0 4px}
.small{font-size:12px}
</style>
</head>
<body>
<div id="toolbar">
  <strong>MellorCraft Seed Map</strong>
  <input id="seed" value="12345" placeholder="Seed number or text">
  <button id="apply">Load Seed</button>
  <select id="dimension">
    <option value="0">Overworld</option>
    <option value="1">Alt Dimension</option>
    <option value="2">Boss Dimension</option>
  </select>
  <label><input type="checkbox" id="structures" checked> Show structures</label>
  <label><input type="checkbox" id="grid" checked> Chunk grid</label>
  <label><input type="checkbox" id="weather" checked> Weather simulation</label>
  <button id="weatherPlay">▶ Play Weather</button>
  <select id="weatherSpeed" title="Weather simulation speed"><option value="1">1×</option><option value="4">4×</option><option value="12">12×</option></select>
  <button id="weatherReset">Reset Weather</button>
  <button id="home">Center 0,0</button>
  <span id="weatherReadout" class="weather-readout"></span>
  <span id="status">Drag to pan • wheel to zoom</span>
</div>
<details id="mapFilters"><summary>Filter biomes &amp; structures ▾</summary><div class="filter-content">
  <h4>Biomes</h4><div class="filter-actions"><button type="button" id="allBiomesBtn">Show all</button><button type="button" id="noBiomesBtn">Hide all</button></div><div id="biomeFilters" class="filter-grid"></div>
  <h4>Structures</h4><div class="filter-actions"><button type="button" id="allStructuresBtn">Show all</button><button type="button" id="noStructuresBtn">Hide all</button></div><div id="structureFilters" class="filter-grid"></div>
  <small style="color:#aabbcc">Hidden biomes appear dark gray. At extreme zoom-out the map uses larger samples for speed.</small>
</div></details>
<canvas id="map"></canvas>
<div id="tooltip"></div>
<div id="legend"></div>
<script>
class SimplexNoise {
    constructor(seed) {
        this.p = new Uint8Array(512);
        const perm = new Uint8Array(256);
        for (let i = 0; i < 256; i++) perm[i] = i;
        let n = seed;
        for (let i = 255; i > 0; i--) {
            n = ((n * 1103515245) + 12345) & 0x7fffffff;
            const j = n % (i + 1);
            [perm[i], perm[j]] = [perm[j], perm[i]];
        }
        for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
    }
    noise2D(x, y) {
        const F2 = 0.5 * (Math.sqrt(3) - 1);
        const G2 = (3 - Math.sqrt(3)) / 6;
        const s = (x + y) * F2;
        const i = Math.floor(x + s), j = Math.floor(y + s);
        const t = (i + j) * G2;
        const x0 = x - (i - t), y0 = y - (j - t);
        const i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
        const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
        const x2 = x0 - 1 + 2*G2, y2 = y0 - 1 + 2*G2;
        const ii = i & 255, jj = j & 255;
        const grad = (h, x, y) => {
            const hh = h & 7;
            const u = hh < 4 ? x : y, v = hh < 4 ? y : x;
            return ((hh & 1) ? -u : u) + ((hh & 2) ? -2*v : 2*v);
        };
        let n0 = 0, n1 = 0, n2 = 0;
        let t0 = 0.5 - x0*x0 - y0*y0;
        if (t0 >= 0) { t0 *= t0; n0 = t0*t0*grad(this.p[ii+this.p[jj]], x0, y0); }
        let t1 = 0.5 - x1*x1 - y1*y1;
        if (t1 >= 0) { t1 *= t1; n1 = t1*t1*grad(this.p[ii+i1+this.p[jj+j1]], x1, y1); }
        let t2 = 0.5 - x2*x2 - y2*y2;
        if (t2 >= 0) { t2 *= t2; n2 = t2*t2*grad(this.p[ii+1+this.p[jj+1]], x2, y2); }
        return 70 * (n0 + n1 + n2);
    }
    noise3D(x, y, z) {
        const F3 = 1/3, G3 = 1/6;
        const s = (x + y + z) * F3;
        const i = Math.floor(x + s), j = Math.floor(y + s), k = Math.floor(z + s);
        const t = (i + j + k) * G3;
        const x0 = x - (i - t), y0 = y - (j - t), z0 = z - (k - t);
        let i1, j1, k1, i2, j2, k2;
        if (x0 >= y0) {
            if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
            else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
            else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
        } else {
            if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
            else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
            else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
        }
        const x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
        const x2 = x0 - i2 + 2*G3, y2 = y0 - j2 + 2*G3, z2 = z0 - k2 + 2*G3;
        const x3 = x0 - 1 + 3*G3, y3 = y0 - 1 + 3*G3, z3 = z0 - 1 + 3*G3;
        const ii = i & 255, jj = j & 255, kk = k & 255;
        const grad3 = (h, x, y, z) => {
            const hh = h & 15;
            const u = hh < 8 ? x : y;
            const v = hh < 4 ? y : (hh === 12 || hh === 14 ? x : z);
            return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
        };
        let n0 = 0, n1 = 0, n2 = 0, n3 = 0;
        let t0 = 0.6 - x0*x0 - y0*y0 - z0*z0;
        if (t0 >= 0) { t0 *= t0; n0 = t0*t0*grad3(this.p[ii+this.p[jj+this.p[kk]]], x0, y0, z0); }
        let t1 = 0.6 - x1*x1 - y1*y1 - z1*z1;
        if (t1 >= 0) { t1 *= t1; n1 = t1*t1*grad3(this.p[ii+i1+this.p[jj+j1+this.p[kk+k1]]], x1, y1, z1); }
        let t2 = 0.6 - x2*x2 - y2*y2 - z2*z2;
        if (t2 >= 0) { t2 *= t2; n2 = t2*t2*grad3(this.p[ii+i2+this.p[jj+j2+this.p[kk+k2]]], x2, y2, z2); }
        let t3 = 0.6 - x3*x3 - y3*y3 - z3*z3;
        if (t3 >= 0) { t3 *= t3; n3 = t3*t3*grad3(this.p[ii+1+this.p[jj+1+this.p[kk+1]]], x3, y3, z3); }
        return 32 * (n0 + n1 + n2 + n3);
    }
    octave(x, y, oct, pers) {
        let total = 0, freq = 1, amp = 1, max = 0;
        for (let i = 0; i < oct; i++) {
            total += this.noise2D(x*freq, y*freq) * amp;
            max += amp; amp *= pers; freq *= 2;
        }
        return total / max;
    }
    octave3D(x, y, z, oct, pers) {
        let total = 0, freq = 1, amp = 1, max = 0;
        for (let i = 0; i < oct; i++) {
            total += this.noise3D(x*freq, y*freq, z*freq) * amp;
            max += amp; amp *= pers; freq *= 2;
        }
        return total / max;
    }
}

const BIOMES={
    PLAINS:0,DESERT_BARREN:1,DESERT_CACTUS:2,FOREST:3,
    MOUNTAINS_LOW:4,MOUNTAINS_MID:5,MOUNTAINS_HIGH:6,
    TAIGA:7,SNOWY_PLAINS:8,BADLANDS:9,OCEAN:10,SWAMP:11,
    JUNGLE:12,SAVANNA:13,BEACH:14,FLOWER_FOREST:15
};
const ALT_BIOMES={RED:0,BLUE:1,GREEN:2};
const BIOME_NAMES=['Plains','Barren Desert','Cactus Desert','Forest','Low Mountains','Medium Mountains','High Mountains','Taiga','Snowy Plains','Badlands','Ocean','Swamp','Jungle','Savanna','Beach','Flower Forest'];
const BIOME_COLORS=['#78a84b','#d7b968','#d9c36d','#2f7b39','#859271','#7b8177','#e8edf0','#477d55','#eaf2fa','#b65c34','#2f69a8','#4c7658','#176d31','#a8aa49','#e5d394','#4f934f'];
const ALT_NAMES=['Red Wastes','Blue Caverns','Green Depths'];
const MOUNTAIN_XZ_SCALE=Math.SQRT1_2; // v1.4.1: half mountain land area, unchanged outline
const ALT_COLORS=['#9a3434','#344f9a','#397a47'];
const STRUCTURE_TYPES=['Mansion','Outpost','Cabin','Dungeon','Alt Maze','Boss Shrine','Boss Arena'];
const enabledBiomes=new Set([...Array(BIOME_NAMES.length).keys()].map(n=>`0:${n}`).concat(ALT_NAMES.map((_,i)=>`1:${i}`),['2:0','2:1']));
const enabledStructures=new Set(STRUCTURE_TYPES.filter(t=>t!=='Dungeon'));
let filterRevision=0;
const WATER_LEVEL=32;
let WORLD_SEED=12345;
let weatherSeed=1,weatherPhase=0,weatherPlaying=false,weatherAnimationLast=0,weatherLastRender=0;
const weatherCloudFade=new Map();
let noise,biomeNoise,treeNoise,caveNoise,oreNoise,ravineNoise,structNoise,continentalNoise,lavaNoise;
const biomeProvinceCache=new Map();
const mountainRegionCache=new Map();
const mountainInfoCache=new Map();

function hashString(str){let hash=0;for(let i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i);hash|=0}return Math.abs(hash)}
function setSeed(value){
  const n=Number(value);
  WORLD_SEED=value.trim()===''?0:(Number.isFinite(n)?Math.trunc(n):hashString(value));
  noise=new SimplexNoise(WORLD_SEED);biomeNoise=new SimplexNoise(WORLD_SEED+1000);
  treeNoise=new SimplexNoise(WORLD_SEED+2000);caveNoise=new SimplexNoise(WORLD_SEED+3000);
  oreNoise=new SimplexNoise(WORLD_SEED+4000);ravineNoise=new SimplexNoise(WORLD_SEED+5000);
  structNoise=new SimplexNoise(WORLD_SEED+6000);continentalNoise=new SimplexNoise(WORLD_SEED+7000);
  lavaNoise=new SimplexNoise(WORLD_SEED+8000);biomeProvinceCache.clear();mountainRegionCache.clear();mountainInfoCache.clear();weatherSeed=weatherSeedForWorldSeed(WORLD_SEED);weatherPhase=0;weatherCloudFade.clear();
}
function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

function smoothstep(edge0, edge1, value) {
            const t = clamp((value - edge0) / Math.max(0.000001, edge1 - edge0), 0, 1);
            return t * t * (3 - 2 * t);
        }

function mix(a, b, amount) { return a + (b - a) * amount; }

// Classic pressure-driven weather test model, matching the lightweight game client.
const WEATHER_PRESSURE_MAX=200;
function weatherSeedForWorldSeed(seed){let n=(Math.trunc(Number(seed)||0)^0x6d2b79f5)|0;n=Math.imul(n^(n>>>15),1|n);n^=n+Math.imul(n^(n>>>7),61|n);return ((n^(n>>>14))>>>0)%2147483647||1}
function weatherHash(x,z){let n=(x*374761393+z*668265263+weatherSeed*69069)|0;n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967295}
function weatherSmooth(t){return t*t*(3-2*t)}
function weatherNoise(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=weatherSmooth(x-ix),fz=weatherSmooth(z-iz);const a=weatherHash(ix,iz),b=weatherHash(ix+1,iz),c=weatherHash(ix,iz+1),d=weatherHash(ix+1,iz+1);return (a+(b-a)*fx)+((c+(d-c)*fx)-(a+(b-a)*fx))*fz}
function weatherPressureAtPhase(x,z,phase=weatherPhase){return Math.round(weatherNoise((x-phase*7)/360,(z-phase*2.6)/360)*WEATHER_PRESSURE_MAX)}
function weatherPressureAt(x,z){return weatherPressureAtPhase(x,z,weatherPhase)}
function weatherCloudFromPressure(p){return p>100?0:clamp(.35+(100-p)/50*.65,0,1)}
function weatherRainFromPressure(p){if(p>=50)return 0;if(p>=30)return .18+(50-p)/20*.27;if(p>=15)return .45+(30-p)/15*.30;return .75+(15-p)/15*.25}
function weatherFogFromPressure(p){return p>=50?0:clamp((50-p)/50,0,1)}
function weatherCellAt(x,z,phase=weatherPhase){const pressure=weatherPressureAtPhase(x,z,phase);return{pressure,cloud:weatherCloudFromPressure(pressure),rain:weatherRainFromPressure(pressure),fog:weatherFogFromPressure(pressure)}}
function weatherLabel(w){const p=w.pressure;return p>100?'Clear':p>=50?'Overcast':p>=30?'Light Rain':p>=15?'Moderate Rain':'Heavy Rain'}
function pressureColor(p,alpha=.34){const t=clamp(p/WEATHER_PRESSURE_MAX,0,1),h=220-t*210,l=42+t*12;return`hsla(${h},78%,${l}%,${alpha})`}
function seedCloudFadeAt(x,z,target){const key=`${Math.floor(x/32)},${Math.floor(z/32)}`,now=performance.now()/1000;let state=weatherCloudFade.get(key);if(!state){state={opacity:0,last:now,seen:now};weatherCloudFade.set(key,state)}const dt=Math.max(0,Math.min(1,now-state.last));state.last=now;state.seen=now;const rate=target>state.opacity?1.15:.32,ease=1-Math.exp(-dt*rate);state.opacity+=(target-state.opacity)*ease;if(state.opacity<.001&&target<=0)state.opacity=0;return state.opacity}

function getClimate(x, z) {
    const warpX = biomeNoise.octave(x * .0017 + 1407, z * .0017 - 2379, 2, .55) * 135;
    const warpZ = biomeNoise.octave(x * .0017 - 3151, z * .0017 + 4783, 2, .55) * 135;
    const sx=x+warpX, sz=z+warpZ, scale=.0008;
    return {temp:biomeNoise.octave(sx*scale,sz*scale,3,.5),moist:biomeNoise.octave(sx*scale+5000,sz*scale+5000,3,.5)};
}

function getContinentValue(x, z) {
            // Broad, low-frequency coastlines keep ocean and land transitions
            // rounded. The former high-frequency detail could change the coastal
            // blend too much in only a few blocks and create sheer walls.
            const continent = continentalNoise.octave(x * 0.00045, z * 0.00045, 3, 0.55);
            const coastDetail = continentalNoise.octave(x * 0.0012 + 800, z * 0.0012 - 800, 2, 0.5) * 0.08;
            return continent + coastDetail;
        }

function getBiomeProvince(cellX, cellZ) {
    // Cache climate at province centers. The warp changes borders, not biome
    // assignment within a province; this prevents thin isotherm/isohyet bands.
    const key = `${cellX},${cellZ}`;
    const existing = biomeProvinceCache.get(key);
    if (existing) return existing;
    if (biomeProvinceCache.size > 20000) biomeProvinceCache.clear();
    const size = 88;
    const px = (cellX + .5 + (coordHash(cellX,cellZ,9101,WORLD_SEED)-.5)*.54)*size;
    const pz = (cellZ + .5 + (coordHash(cellX,cellZ,9102,WORLD_SEED)-.5)*.54)*size;
    // Independent continent-scale temperature and rainfall fields make nearby
    // provinces climatically similar, rather than drawing unrelated biome IDs.
    // Frequency is deliberately far below the province-grid frequency.
    const temp = biomeNoise.octave(px*.00135+1351,pz*.00135-2791,2,.55)*1.4;
    const moist = biomeNoise.octave(px*.00150-3701,pz*.00150+6143,2,.55)*1.25;
    let biome;
    if (temp >= .20) {
        if (moist > .25) biome = BIOMES.JUNGLE;
        else if (moist > .045) biome = BIOMES.SAVANNA;
        else if (moist < -.33) biome = BIOMES.BADLANDS;
        else if (moist < -.125) biome = BIOMES.DESERT_BARREN;
        else biome = BIOMES.DESERT_CACTUS;
    } else if (temp >= .10) {
        if (moist > .29) biome = BIOMES.JUNGLE;
        else if (moist < .12) biome = BIOMES.SAVANNA;
        else biome = BIOMES.FOREST;
    } else if (temp < -.34) {
        if (moist > -.02 && coordHash(cellX,cellZ,9372,WORLD_SEED)<.32) biome = BIOMES.TAIGA;
        else if (temp > -.70 && moist > -.20) biome = BIOMES.FOREST;
        else biome = BIOMES.PLAINS;
    } else if (temp < -.20) {
        if (moist > .29 && coordHash(cellX,cellZ,9372,WORLD_SEED)<.24) biome = BIOMES.TAIGA;
        else if (moist > .07) biome = BIOMES.FOREST;
        else biome = BIOMES.PLAINS;
    } else if (moist > .16) {
        // A flower forest is a whole temperate province, not a small grid tile.
        biome = temp > -.14 && temp < .12 && coordHash(cellX,cellZ,8151,WORLD_SEED) < .055
            ? BIOMES.FLOWER_FOREST : BIOMES.FOREST;
    } else {
        biome = BIOMES.PLAINS;
    }
    // A second, climate-compatible draw gives forests about twice their former
    // selection weight. Provinces stay at 88 blocks: no bigger forest patches.
    // Only promote temperate plains; deserts, mountains and icy areas remain intact.
    if (biome === BIOMES.PLAINS && temp >= -.34 && temp < .20 && moist > -.14 &&
        coordHash(cellX, cellZ, 9403, WORLD_SEED) < .17) {
        biome = (temp > -.14 && temp < .12 && coordHash(cellX,cellZ,8151,WORLD_SEED)<.055)
            ? BIOMES.FLOWER_FOREST : BIOMES.FOREST;
    }
    // Preserve plausible climate neighbors at the scale of full provinces.
    // Dry hot deserts should border savanna/badlands rather than jungle;
    // cold taiga/peaks should reach them only through temperate plains.
    // Changing the intervening province prevents a thin ecotone strip.
    if ([BIOMES.TAIGA,BIOMES.JUNGLE,BIOMES.FOREST,BIOMES.FLOWER_FOREST].includes(biome)) {
        outer: for (let dx=-2; dx<=2; dx++) for (let dz=-2; dz<=2; dz++) {
            if (!dx && !dz) continue;
            const nx=cellX+dx, nz=cellZ+dz;
            const qx=(nx+.5+(coordHash(nx,nz,9101,WORLD_SEED)-.5)*.54)*size;
            const qz=(nz+.5+(coordHash(nx,nz,9102,WORLD_SEED)-.5)*.54)*size;
            const neighborTemp=biomeNoise.octave(qx*.00135+1351,qz*.00135-2791,2,.55)*1.4;
            const neighborMoist=biomeNoise.octave(qx*.00150-3701,qz*.00150+6143,2,.55)*1.25;
            const desertNeighbor=neighborTemp>=.20 && neighborMoist<=.045;
            if (desertNeighbor) {
                biome=(biome===BIOMES.JUNGLE||biome===BIOMES.FOREST||biome===BIOMES.FLOWER_FOREST) && temp>=.10
                    ? BIOMES.SAVANNA : BIOMES.PLAINS;
                break outer;
            }
            if ((biome===BIOMES.TAIGA) && Math.max(Math.abs(dx),Math.abs(dz))<=1 && neighborTemp>=.10 && neighborMoist<.28) {
                biome=BIOMES.PLAINS;
                break outer;
            }
        }
    }
    // Deterministic province-level 50/50 split preserves biome patch sizes.
    if (biome === BIOMES.TAIGA && coordHash(cellX,cellZ,9373,WORLD_SEED)<0.5)
        biome = BIOMES.SNOWY_PLAINS;
    const result = { x:px, z:pz, biome, temp, moist };
    biomeProvinceCache.set(key,result);
    return result;
}

function getBaseBiome(x, z) {
    // Seeded, jittered two-dimensional climate provinces. The closest center
    // gives each biome a substantial rounded footprint instead of a thin strip
    // formed where several climate thresholds almost coincide.
    const warpX = biomeNoise.octave(x*.0046+1741,z*.0046-1927,2,.55)*18;
    const warpZ = biomeNoise.octave(x*.0046-2881,z*.0046+3653,2,.55)*18;
    const px=x+warpX,pz=z+warpZ,grid=88;
    const cx=Math.floor(px/grid),cz=Math.floor(pz/grid);
    let nearest=null,best=Infinity;
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
        const province=getBiomeProvince(cx+dx,cz+dz);
        const distance=(px-province.x)**2+(pz-province.z)**2;
        if(distance<best){best=distance;nearest=province;}
    }
    return nearest.biome;
}

function getMountainRegion(cellX, cellZ) {
const key = `${cellX},${cellZ}`;
if (mountainRegionCache.has(key)) return mountainRegionCache.get(key);
const grid = 420;
const mh = (salt) => coordHash(cellX, cellZ, salt, WORLD_SEED + salt * 131);
// Mountain regions remain twice as common as the older generator, but
// each seed receives different locations, chains, heights, and outlines.
if (mh(900) >= 0.38) {
    mountainRegionCache.set(key, null);

}

    for(const s of lastStructures){
      const p=screenFromWorld(s.cx,s.cz);if(p.x<-20||p.x>canvas.width+20||p.y<-20||p.y>canvas.height+20)continue;
      ctx.fillStyle='#ffdf4d';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.fillText(symbols[s.type]||'?',p.x,p.y+5);
    }
  }
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(canvas.width/2-8,canvas.height/2);ctx.lineTo(canvas.width/2+8,canvas.height/2);ctx.moveTo(canvas.width/2,canvas.height/2-8);ctx.lineTo(canvas.width/2,canvas.height/2+8);ctx.stroke();
  const centerWeather=weatherCellAt(centerX,centerZ);document.getElementById('weatherReadout').textContent=dim===0&&document.getElementById('weather').checked?`${weatherLabel(centerWeather)} • P ${centerWeather.pressure}/200 • Cloud ${Math.round(centerWeather.cloud*100)}% • Rain ${Math.round(centerWeather.rain*100)}% • Fog ${Math.round(centerWeather.fog*100)}%`:'';document.getElementById('status').textContent=`Seed ${WORLD_SEED} • Center ${Math.round(centerX)}, ${Math.round(centerZ)} • ${scale.toFixed(2)} px/block • Weather t=${weatherPhase.toFixed(1)}`;
}canvas.addEventListener('mousedown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging')});
addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('dragging')});
addEventListener('mousemove',e=>{
  if(drag){centerX-=(e.clientX-lastX)/scale;centerZ-=(e.clientY-lastY)/scale;lastX=e.clientX;lastY=e.clientY;render()}
  const rect=canvas.getBoundingClientRect(),w=worldFromScreen(e.clientX-rect.left,e.clientY-rect.top),x=Math.floor(w.x),z=Math.floor(w.z),dim=Number(document.getElementById('dimension').value);
  let lines=[`X: ${x} &nbsp; Z: ${z}`];
  if(dim===0){const b=getBiome(x,z);lines.push(`Biome: ${BIOME_NAMES[b]}`,`Surface Y: ${getHeight(x,z,b)}`);if(document.getElementById('weather').checked){const wx=weatherCellAt(x,z);lines.push(`Weather: ${weatherLabel(wx)}`,`Pressure: ${wx.pressure}/200`,`Cloud: ${Math.round(wx.cloud*100)}% • Rain: ${Math.round(wx.rain*100)}% • Fog: ${Math.round(wx.fog*100)}%`)}}
  else if(dim===1)lines.push(`Biome: ${ALT_NAMES[getAltBiome(x,z)]}`,`Alt Dimension height: 50 blocks (Y 0-49)`);
  else lines.push(Math.hypot(x,z)<=35?'Inside boss island':'Void');
  let near=null,dist=Infinity;for(const s of lastStructures){const d=Math.hypot(s.cx-x,s.cz-z);if(d<dist){dist=d;near=s}}
  if(near&&dist<30){
    lines.push(`Nearby: ${near.type} (${Math.round(dist)} blocks)`,`Structure Y: ${Math.round(near.y||0)}`);
    if(near.type==='Cabin')lines.push(`Cabin block: ${near.loot}`);
    if(near.type==='Alt Maze')lines.push(`Maze layout: ${near.layout}/3`, `Maze base Y: ${near.y}`,`Mellorite room relative: X ${near.melloriteRelativeX}, Z ${near.melloriteRelativeZ}`,`Mellorite room floor: ${near.melloriteFloor}`,`Mellorite room Y: ${near.melloriteY}`);
  }
  const tip=document.getElementById('tooltip');tip.innerHTML=lines.join('<br>');tip.style.display='block';tip.style.left=Math.min(innerWidth-280,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-110,e.clientY+14)+'px';
});
canvas.addEventListener('mouseleave',()=>document.getElementById('tooltip').style.display='none');
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),before=worldFromScreen(e.clientX-r.left,e.clientY-r.top);scale=clamp(scale*(e.deltaY<0?1.22:.82),.15,12);const after=worldFromScreen(e.clientX-r.left,e.clientY-r.top);centerX+=before.x-after.x;centerZ+=before.z-after.z;render()},{passive:false});
document.getElementById('apply').onclick=()=>{setSeed(document.getElementById('seed').value);centerX=0;centerZ=0;render()};
document.getElementById('home').onclick=()=>{centerX=0;centerZ=0;render()};
document.getElementById('dimension').onchange=()=>{buildLegend();buildFilters();render()};document.getElementById('structures').onchange=render;document.getElementById('grid').onchange=render;document.getElementById('weather').onchange=render;
document.getElementById('weatherPlay').onclick=()=>{weatherPlaying=!weatherPlaying;const b=document.getElementById('weatherPlay');b.textContent=weatherPlaying?'⏸ Pause Weather':'▶ Play Weather';b.classList.toggle('active',weatherPlaying);weatherAnimationLast=performance.now()};
document.getElementById('weatherReset').onclick=()=>{weatherPhase=0;weatherCloudFade.clear();weatherAnimationLast=performance.now();render()};
document.getElementById('weatherSpeed').onchange=()=>{weatherAnimationLast=performance.now()};
document.getElementById('seed').addEventListener('keypress',e=>{if(e.key==='Enter')document.getElementById('apply').click()});
function weatherAnimationFrame(now){if(weatherPlaying){const dt=Math.min(.1,Math.max(0,(now-weatherAnimationLast)/1000)),speed=Number(document.getElementById('weatherSpeed').value)||1;weatherPhase+=dt*.35*speed;if(now-weatherLastRender>=125){weatherLastRender=now;render()}}weatherAnimationLast=now;requestAnimationFrame(weatherAnimationFrame)}
requestAnimationFrame(weatherAnimationFrame);
function buildLegend(){
 const dim=Number(document.getElementById('dimension').value),el=document.getElementById('legend');
 const active=BIOME_NAMES.map((_,i)=>i);
 const rows=dim===0?active.map(i=>[BIOME_NAMES[i],BIOME_COLORS[i]]):dim===1?ALT_NAMES.map((n,i)=>[n,ALT_COLORS[i]]):[['Boss island','#56176a'],['Void','#08030d']];
 el.innerHTML='<strong>Legend</strong>'+rows.map(r=>`<div class="legend-row"><span class="swatch" style="background:${r[1]}"></span>${r[0]}</div>`).join('')+'<hr><div>M Mansion • O Outpost • C Cabin • D Dungeon<br>A Alt Maze • S Boss Shrine</div>'+(dim===0?'<hr><div><strong>Weather</strong><br><span style="color:#78a8ff">Low pressure</span> → <span style="color:#ff9a66">high pressure</span><br>Clouds fade in below pressure 100<br><span style="color:#8fc8ff">Blue</span> = rain/fog intensity<br>Overcast 50–100 • Light rain 30–50 • Moderate 15–30 • Heavy &lt;15</div>':'');
}
function buildFilters(){
 const dim=Number(document.getElementById('dimension').value);
 const biomeItems=dim===0?BIOME_NAMES:dim===1?ALT_NAMES:['Boss island','Void'];
 const bBox=document.getElementById('biomeFilters');bBox.replaceChildren();
 biomeItems.forEach((name,index)=>{
   const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=enabledBiomes.has(dim+':'+index);
   input.onchange=()=>{const key=dim+':'+index;input.checked?enabledBiomes.add(key):enabledBiomes.delete(key);filterRevision++;render()};
   label.append(input,document.createTextNode(name));bBox.append(label);
 });
 const structures=dim===0?['Mansion','Outpost','Cabin','Dungeon']:dim===1?['Alt Maze','Boss Shrine']:['Boss Arena'];
 const sBox=document.getElementById('structureFilters');sBox.replaceChildren();
 structures.forEach(name=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=enabledStructures.has(name);
 input.onchange=()=>{input.checked?enabledStructures.add(name):enabledStructures.delete(name);render()};
 label.append(input,document.createTextNode(name));sBox.append(label);
 });
}
function setAllFilters(kind,enabled){
 const dim=Number(document.getElementById('dimension').value);
 if(kind==='biomes'){
   const n=dim===0?BIOME_NAMES.length:dim===1?ALT_NAMES.length:2;
   for(let i=0;i<n;i++){const key=dim+':'+i;enabled?enabledBiomes.add(key):enabledBiomes.delete(key);}
 }else{
   const names=dim===0?['Mansion','Outpost','Cabin','Dungeon']:dim===1?['Alt Maze','Boss Shrine']:['Boss Arena'];
   for(const n of names)enabled?enabledStructures.add(n):enabledStructures.delete(n);
 }
 if(kind==='biomes')filterRevision++;buildFilters();render();
}
for(const [id,kind,show] of [['allBiomesBtn','biomes',true],['noBiomesBtn','biomes',false],['allStructuresBtn','structures',true],['noStructuresBtn','structures',false]])
 document.getElementById(id).addEventListener('click',()=>setAllFilters(kind,show));
document.getElementById('mapFilters').addEventListener('toggle',()=>{document.getElementById('mapFilters').style.top=(document.getElementById('toolbar').offsetHeight+5)+'px'});
setSeed('12345');buildLegend();buildFilters();resize();
</script>
</body>
</html>
